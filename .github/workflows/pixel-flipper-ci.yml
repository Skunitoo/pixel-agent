name: Pixel Flipper APK
on:
  push:
    branches: [pixel-flipper-build]
    paths:
      - 'pixel-flipper/**'
      - '.github/workflows/pixel-flipper-ci.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract self-contained Android project
        shell: bash
        run: |
          mkdir -p pixel-flipper/project
          base64 -d pixel-flipper/payload.b64 | tar xzf - -C pixel-flipper/project
          test -f pixel-flipper/project/settings.gradle
      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure runner Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        working-directory: pixel-flipper/project
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelFlipper-v0.2-debug
          path: pixel-flipper/project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
